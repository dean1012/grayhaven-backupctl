name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install operating system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-selinux

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip_audit --progress-spinner off -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile grayhaven-backupctl

      - name: Mypy type check
        run: |
          mypy --strict grayhaven-backupctl

      - name: Ruff lint
        run: |
          ruff check grayhaven-backupctl tests

      - name: Ruff format check
        run: |
          ruff format --check grayhaven-backupctl tests

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
